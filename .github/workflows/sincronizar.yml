name: Sincronizar catálogo desde Google Sheets

on:
  schedule:
    - cron: '7 * * * *'      # cada hora (minuto 7, hora UTC)
  workflow_dispatch: {}      # botón "Run workflow" = Actualizar ahora

permissions:
  contents: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer la hoja y validar
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: node scripts/sync.mjs
      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- data/productos.json; then
            echo "Sin cambios en el catálogo."
          else
            git config user.name "Sincronizador MN Scents"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/productos.json
            git commit -m "Catálogo actualizado desde Google Sheets"
            git push
          fi
