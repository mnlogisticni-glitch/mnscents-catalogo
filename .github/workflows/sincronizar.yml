name: Sincronizar catálogo desde Google Sheets

on:
  schedule:
    - cron: '7 * * * *'      # cada hora (minuto 7, hora UTC)
  workflow_dispatch: {}      # botón "Run workflow" = Actualizar ahora

permissions:
  contents: write

concurrency:
  group: sincronizar
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Siempre la versión más reciente de main (también al usar "Re-run")
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Leer la hoja y validar
        env:
          # Como secreto, GitHub la oculta en los registros públicos (***). La variable queda de respaldo.
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL || vars.SHEET_CSV_URL }}
        run: node scripts/sync.mjs
      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- data/productos.json; then
            echo "Sin cambios en el catálogo."
          else
            git config user.name "Sincronizador MN Scents"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/productos.json
            git commit -m "Catálogo actualizado desde Google Sheets"
            # Si alguien subió algo mientras corría, se pone encima y reintenta
            for intento in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep 5
            done
            exit 1
          fi
